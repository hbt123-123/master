[build]
  command = "npm install && mkdir -p dist/static && cp index.html dist/ && cp -r static/. dist/static/"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["src/**/*", "data/**/*"]

[functions."*"]
  max_duration = 10

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/service/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
